name: Supabase Keepalive

# Supabase 무료 티어는 7일간 활동 없으면 자동 pause됨.
# 이 workflow가 매일 1회 간단한 쿼리를 보내서 pause를 방지함.

on:
  schedule:
    # 매일 UTC 03:17 (KST 12:17) 실행. 정각(0분)은 GitHub 부하로 밀릴 수 있어 임의 분으로 설정.
    - cron: '17 3 * * *'
  workflow_dispatch:  # Actions 탭에서 수동 실행 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase to prevent auto-pause
        env:
          SUPABASE_URL: https://odexjawwfgvglaborzdn.supabase.co
          SUPABASE_KEY: sb_publishable_Q0SLcw4XljrL1nI91D8-lg_NLXDGkir
        run: |
          echo "Pinging Supabase REST API..."
          # 응답 본문과 HTTP 코드를 모두 출력. 2xx가 아니면 실패로 간주.
          RESPONSE=$(curl -sS -X GET \
            "$SUPABASE_URL/rest/v1/transactions?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -w "\nHTTP_CODE:%{http_code}")
          echo "Response:"
          echo "$RESPONSE"
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1 | sed 's/HTTP_CODE://')
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Keepalive ping successful (HTTP $HTTP_CODE) at $(date -u)"
          else
            echo "❌ Keepalive ping failed (HTTP $HTTP_CODE)"
            exit 1
          fi
